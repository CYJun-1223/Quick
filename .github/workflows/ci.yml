name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.300

      - name: Restore
        run: |
          dotnet restore tests/Quick.Tests/Quick.Tests.csproj --runtime win-x64
          dotnet restore Quick.csproj --runtime win-x64

      - name: Build
        run: dotnet build tests/Quick.Tests/Quick.Tests.csproj --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/Quick.Tests/Quick.Tests.csproj --configuration Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Run application self-check
        run: dotnet run --project Quick.csproj --configuration Release --no-build -- --self-test

      - name: Publish portable build
        run: dotnet publish Quick.csproj --configuration Release --no-restore -p:PublishProfile=Portable

      - name: Verify portable artifact
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "release/Quick-portable/Quick.exe")) {
            throw "Portable artifact was not generated."
          }
